spring.application.name=cassette-server

# Defaults. The short flags (--port, --storage-dir, --admin-token, --client-token,
# --default-mode) are rewritten to these properties in CassetteServerApplication#main, so they
# beat environment variables; CASSETTE_STORAGE_DIR and friends still work without a flag.
server.port=9090

# Health only. Nothing else from actuator is exposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.main.banner-mode=off

# No form endpoints here. Left on, FormContentFilter swallows the body of a PUT sent as
# application/x-www-form-urlencoded (curl's default for --data-binary), and a perfectly
# good fixture is refused as "not a JSON object".
spring.mvc.formcontent.filter.enabled=false
