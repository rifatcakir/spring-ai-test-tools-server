name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The end-to-end job pulls a real Ollama model, so it runs nightly, not on every push.
    - cron: "41 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Server tests (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn test
        run: mvn --batch-mode --no-transfer-progress test
      - name: Fail if the test run left the working tree dirty
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::mvn test modified the working tree."
            git diff
            exit 1
          fi

  e2e:
    name: End to end with the published library and real Ollama (JDK 21)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # The image is built with docker build (BuildKit) and handed to the test, because
      # Testcontainers' legacy-API build of this multi-stage Dockerfile fails on the hosted
      # runners' Docker Engine ("layer does not exist"). Locally the test builds it itself.
      - name: Build the server jar and image
        run: |
          mvn --batch-mode --no-transfer-progress -pl spring-ai-test-tools-server package -DskipTests
          docker build --build-arg VERSION=ci -t cassette-server-it:ci spring-ai-test-tools-server
      - name: mvn -Pintegration-test verify
        run: mvn --batch-mode --no-transfer-progress -Pintegration-test verify -Dcassette.server.image=cassette-server-it:ci
